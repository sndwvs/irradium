<VirtualHost _default_:80>
    DocumentRoot "/usr/share/zabbix/ui"

    ProxyTimeout 300

    <Directory "/usr/share/zabbix/ui">
        Options FollowSymLinks
        AllowOverride None
        Require all granted

        <IfModule dir_module>
            DirectoryIndex index.php
        </IfModule>

        <FilesMatch \.(php|phar)$>
            SetHandler "proxy:unix:/run/php-fpm.zabbix.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    <Directory "/usr/share/zabbix/ui/conf">
        Require all denied
    </Directory>

    <Directory "/usr/share/zabbix/ui/app">
        Require all denied
    </Directory>

    <Directory "/usr/share/zabbix/ui/include">
        Require all denied
    </Directory>

    <Directory "/usr/share/zabbix/ui/local">
        Require all denied
    </Directory>

    <Directory "/usr/share/zabbix/ui/vendor">
        Require all denied
    </Directory>

</VirtualHost>
